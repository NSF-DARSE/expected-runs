[pytest]
# Only files named test_*.py are tests. pytest's other default pattern,
# *_test.py, would collect the one-off analysis scripts in
# component_model/portal/, which do real work (and load a data extract that
# may not exist) at import time. Collection there takes ~10 minutes and then
# fails, so the pattern is narrowed rather than the scripts renamed.
python_files = test_*.py

# Directories a bare `python -m pytest` from the repo root should not walk.
testpaths =
    component_model/analysis/tests
    webapp_publisher/tests
    python_files/tests

# pytest's defaults (setting this key replaces them, so they are repeated here)
# plus portal, so `python -m pytest component_model` stays safe too.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} docs component_model/portal
